name: Merge liquidity chart now

on:
  push:
    paths:
      - '.github/workflows/merge-liquidity-chart.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge liquidity charts
        run: python merge_liquidity_chart.py
      - name: Commit merged chart
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Show margin balance and turnover on one chart"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
