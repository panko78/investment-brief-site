name: Update market dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_data.py'
      - 'fix_liquidity.py'
      - 'update_chart.py'
      - 'collect_market_details.py'
      - 'repair_stock_snapshots.py'
      - 'preserve_etf_fallback.py'
      - 'validate_dashboard.py'
      - 'sanitize_dashboard.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    # Beijing time: 08:00 premarket refresh + 08:10 redundant retry
    - cron: '0 0 * * 1-5'
    - cron: '10 0 * * 1-5'
    # Beijing time: 09:35 / 09:45 redundant retry / 10:30 / 11:35
    - cron: '35 1 * * 1-5'
    - cron: '45 1 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '35 3 * * 1-5'
    # Beijing time: 13:30 / 14:30 / 15:15 / 15:45 (post-close freshness checks)
    - cron: '30 5 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '45 7 * * 1-5'
    # Beijing time: 02:20 next morning (Tue-Sat). Catch delayed post-close
    # disclosures such as SSE ETF shares and retry transient upstream failures.
    - cron: '20 18 * * 1-5'
    # Redundant 02:35 overnight trigger. GitHub scheduled events can occasionally
    # be delayed or skipped; this second trigger gives the self-healing pass another
    # chance without changing the data-validity rules.
    - cron: '35 18 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-dashboard-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh macro and commodity sources without blocking core A-share data
        run: |
          # Liquidity is refreshed by fix_liquidity.py in the next bounded step. Do not run the
          # older 45-day liquidity crawl here, because it can consume the entire non-core timeout
          # before trade/commodity sources get a chance to refresh.
          timeout 75s python -u - <<'PY' || echo "Non-core refresh timed out/failed; retaining last verified non-core values"
          from datetime import datetime
          import json
          import update_data as u

          data = u.load_data()
          u.fetch_trade(data)
          u.fetch_metals(data)
          data["updated_at"] = datetime.now().strftime("%Y-%m-%d %H:%M")
          u.DATA.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Sanitize cached market series
        run: python sanitize_dashboard.py

      - name: Recalculate liquidity with multi-source fallback
        run: |
          # Liquidity is important, but a stalled exchange/AkShare endpoint must never block
          # sector/stock/ETF/limit-up collection. Try twice with hard bounds; on failure retain
          # the last verified liquidity series and let the final validator report any staleness.
          liquidity_ok=0
          for i in 1 2; do
            if timeout 75s python fix_liquidity.py; then
              liquidity_ok=1
              break
            fi
            rc=$?
            echo "Liquidity refresh attempt $i failed/timed out (exit $rc)"
            sleep $((i*10))
          done
          if [ "$liquidity_ok" != "1" ]; then
            echo "Liquidity refresh unavailable; continuing with last verified liquidity data"
          fi

      - name: Validate liquidity chart wiring
        run: python update_chart.py

      - name: Capture last verified ETF comparison
        run: python preserve_etf_fallback.py capture

      - name: Collect sector, stock, ETF and limit-up details
        run: |
          python collect_market_details.py || true
          # A second pass reuses successful first-pass/cache data and retries missing datasets.
          python collect_market_details.py --reuse

      - name: Repair missing candidate-stock snapshots from independent source
        run: python repair_stock_snapshots.py

      - name: Restore verified ETF comparison if upstream is unavailable
        run: python preserve_etf_fallback.py restore

      - name: Validate final dashboard output
        run: python validate_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          git add dashboard.json
          if [ -f market_details.json ]; then
            git add market_details.json
          fi

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market dashboard data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
