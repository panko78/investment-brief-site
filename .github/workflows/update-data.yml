name: Update market dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_data.py'
      - 'fix_liquidity.py'
      - 'update_chart.py'
      - 'collect_market_details.py'
      - 'preserve_etf_fallback.py'
      - 'validate_dashboard.py'
      - 'sanitize_dashboard.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    # Beijing time: 08:00 premarket refresh
    - cron: '0 0 * * 1-5'
    # Beijing time: 09:35 / 10:30 / 11:35
    - cron: '35 1 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '35 3 * * 1-5'
    # Beijing time: 13:30 / 14:30 / 15:15 / 15:45
    - cron: '30 5 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '45 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-dashboard-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh macro and commodity sources without blocking core A-share data
        run: |
          # update_data.py contains slower macro/commodity/history sources. If a provider hangs,
          # keep the last verified values and continue to the strict A-share refresh below.
          timeout 75s python update_data.py || echo "Non-core refresh timed out/failed; retaining last verified non-core values"

      - name: Sanitize cached market series
        run: python sanitize_dashboard.py

      - name: Recalculate liquidity with multi-source fallback
        run: |
          for i in 1 2 3; do
            python fix_liquidity.py && break
            if [ "$i" = "3" ]; then exit 1; fi
            sleep $((i*15))
          done

      - name: Validate liquidity chart wiring
        run: python update_chart.py

      - name: Capture last verified ETF comparison
        run: python preserve_etf_fallback.py capture

      - name: Collect sector, stock, ETF and limit-up details
        run: |
          python collect_market_details.py || true
          # A second pass reuses successful first-pass/cache data and retries missing datasets.
          python collect_market_details.py --reuse

      - name: Restore verified ETF comparison if upstream is unavailable
        run: python preserve_etf_fallback.py restore

      - name: Validate final dashboard output
        run: python validate_dashboard.py

      - name: Commit updated dashboard
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          git add dashboard.json
          if [ -f market_details.json ]; then
            git add market_details.json
          fi

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market dashboard data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
