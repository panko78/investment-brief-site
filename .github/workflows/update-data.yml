name: Update market dashboard

on:
  workflow_dispatch:
  schedule:
    # Beijing time: 06:30-08:30, every 15 minutes
    - cron: '30,45 22 * * *'
    - cron: '0,15,30,45 23 * * *'
    - cron: '0,15,30 0 * * *'

    # Beijing time: 15:30-17:30, every 15 minutes
    - cron: '30,45 7 * * *'
    - cron: '0,15,30,45 8 * * *'
    - cron: '0,15,30 9 * * *'

permissions:
  contents: write

concurrency:
  group: market-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update market data
        run: python update_data.py

      - name: Commit updated dashboard
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          git add dashboard.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market dashboard data"
            git push
          fi
