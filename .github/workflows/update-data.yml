name: Update market dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_data.py'
      - 'fix_liquidity.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    # Beijing time: 08:00
    - cron: '0 0 * * *'

    # Beijing time: 15:15
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: market-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update market data
        run: python update_data.py

      - name: Recalculate liquidity with corrected market-wide definitions
        run: python fix_liquidity.py

      - name: Commit updated dashboard
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          git add dashboard.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market dashboard data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
