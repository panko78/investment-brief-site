name: Update market dashboard

# self-heal trigger: 2026-09-16 12:05 CST
on:
  workflow_dispatch:
  push:
    paths:
      - 'update_data.py'
      - 'fix_liquidity.py'
      - 'update_chart.py'
      - 'collect_market_details.py'
      - 'collect_sector_ranking.py'
      - 'collect_live_limits.py'
      - 'refresh_dynamic_sectors.py'
      - 'repair_realtime_close.py'
      - 'repair_stock_snapshots.py'
      - 'preserve_etf_fallback.py'
      - 'validate_sector_windows.py'
      - 'validate_dashboard.py'
      - 'validate_sector_fallback.py'
      - 'harden_frontend.py'
      - 'sanitize_dashboard.py'
      - 'sync_close_brief.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '10 0 * * 1-5'
    - cron: '35 1 * * 1-5'
    - cron: '45 1 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '35 3 * * 1-5'
    - cron: '45 3 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '5 7 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '45 7 * * 1-5'
    - cron: '20 18 * * 1-5'
    - cron: '35 18 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-dashboard-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
