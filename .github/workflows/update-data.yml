name: Update market dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'update_data.py'
      - 'fix_liquidity.py'
      - 'update_chart.py'
      - 'collect_market_details.py'
      - 'collect_sector_ranking.py'
      - 'refresh_dynamic_sectors.py'
      - 'repair_realtime_close.py'
      - 'repair_stock_snapshots.py'
      - 'preserve_etf_fallback.py'
      - 'validate_dashboard.py'
      - 'sanitize_dashboard.py'
      - 'sync_close_brief.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
  schedule:
    # Beijing time: 08:00 premarket refresh + 08:10 redundant retry
    - cron: '0 0 * * 1-5'
    - cron: '10 0 * * 1-5'
    # Beijing time: 09:35 / 09:45 redundant retry / 10:30 / 11:35 / 11:45 redundant retry
    - cron: '35 1 * * 1-5'
    - cron: '45 1 * * 1-5'
    - cron: '30 2 * * 1-5'
    - cron: '35 3 * * 1-5'
    - cron: '45 3 * * 1-5'
    # Beijing time: 13:30 / 14:30 / 15:15 / 15:45 (post-close freshness checks)
    - cron: '30 5 * * 1-5'
    - cron: '30 6 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '45 7 * * 1-5'
    # Beijing time: 02:20 next morning (Tue-Sat). Catch delayed post-close disclosures.
    - cron: '20 18 * * 1-5'
    # Redundant 02:35 overnight trigger.
    - cron: '35 18 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-dashboard-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh macro and commodity sources without blocking core A-share data
        run: |
          timeout 75s python -u - <<'PY' || echo "Non-core refresh timed out/failed; retaining last verified non-core values"
          from datetime import datetime
          import json
          import update_data as u

          data = u.load_data()
          u.fetch_trade(data)
          u.fetch_metals(data)
          data["updated_at"] = datetime.now().strftime("%Y-%m-%d %H:%M")
          u.DATA.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: Sanitize cached market series
        run: python sanitize_dashboard.py

      - name: Recalculate liquidity with multi-source fallback
        run: |
          liquidity_ok=0
          for i in 1 2; do
            if timeout 75s python fix_liquidity.py; then
              liquidity_ok=1
              break
            fi
            rc=$?
            echo "Liquidity refresh attempt $i failed/timed out (exit $rc)"
            sleep $((i*10))
          done
          if [ "$liquidity_ok" != "1" ]; then
            echo "Liquidity refresh unavailable; continuing with last verified liquidity data"
          fi

      - name: Validate liquidity chart wiring
        run: python update_chart.py

      - name: Refresh market-wide industry fund-flow ranking
        run: |
          python collect_sector_ranking.py || echo "Dynamic industry ranking unavailable; retaining last verified ranking"

      - name: Capture last verified ETF comparison
        run: python preserve_etf_fallback.py capture

      - name: Collect sector, stock, ETF and limit-up details
        run: |
          python collect_market_details.py || true
          python collect_market_details.py --reuse

      - name: Replace fixed sector watchlist with dynamic fund-flow leaders
        run: |
          python refresh_dynamic_sectors.py || echo "Dynamic sector history refresh unavailable; retaining last verified sector set"

      - name: Repair same-day close snapshots and turnover from realtime fallbacks
        run: python repair_realtime_close.py

      - name: Repair missing candidate-stock snapshots from independent source
        run: python repair_stock_snapshots.py

      - name: Restore verified ETF comparison if upstream is unavailable
        run: python preserve_etf_fallback.py restore

      - name: Validate final dashboard output
        run: python validate_dashboard.py

      - name: Sync verified post-close facts into brief
        run: python sync_close_brief.py

      - name: Commit updated dashboard
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"

          git add dashboard.json brief.json
          if [ -f market_details.json ]; then
            git add market_details.json
          fi
          if [ -f sector_ranking.json ]; then
            git add sector_ranking.json
          fi

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update market dashboard data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
