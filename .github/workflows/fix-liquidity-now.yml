name: Fix liquidity now

on:
  push:
    paths:
      - '.github/workflows/fix-liquidity-now.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Recalculate liquidity only
        run: python fix_liquidity.py
      - name: Commit corrected liquidity data
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.json
          if git diff --cached --quiet; then
            echo "No liquidity changes"
          else
            git commit -m "Correct liquidity dashboard data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
