name: Update Shanghai Composite now

on:
  push:
    paths:
      - '.github/workflows/update-sh-index-now.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update Shanghai Composite data
        run: python update_sh_index.py
      - name: Update chart
        run: python update_chart.py
      - name: Commit
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard.json index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Shanghai Composite to liquidity chart"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
