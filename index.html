<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每日投资简报</title>
  <style>
    :root{--bg:#f6f7f9;--card:#fff;--text:#15171a;--muted:#69707a;--line:#e7e9ed;--good:#15803d;--bad:#b42318;--tag:#eef2f7}
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:18px}
    h1{font-size:30px;margin:0 0 6px}.sub{color:var(--muted);font-size:14px}.status{padding:7px 10px;border-radius:999px;background:#eefbf3;color:var(--good);font-weight:700;font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.card,.summary{background:var(--card);border:1px solid var(--line);border-radius:16px}.metric{padding:16px}.metric .k{font-size:13px;color:var(--muted)}.metric .v{font-size:24px;font-weight:800;margin-top:6px}
    .section-title{font-size:18px;margin:24px 0 10px}.cards{display:grid;gap:14px}.card{padding:18px}.card-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.rank{font-size:12px;color:var(--muted);font-weight:700}.title{font-size:20px;font-weight:800;margin:3px 0 8px}.stars{white-space:nowrap;font-weight:800}
    .row{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:none}.label{font-size:13px;color:var(--muted);font-weight:700}
    .tags{display:flex;flex-wrap:wrap;gap:7px}.tag{background:var(--tag);border-radius:999px;padding:5px 9px;font-size:12px}.tag.real{background:#ecfdf3;color:#067647}.tag.map{background:#eff8ff;color:#175cd3}.tag.mood{background:#fff4ed;color:#b54708}
    .summary{padding:18px;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{color:var(--muted);font-size:12px}.risk{color:var(--bad);font-weight:700}footer{color:var(--muted);font-size:12px;padding:18px 2px}
    @media(max-width:780px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr}.wrap{padding:14px}h1{font-size:25px}table{display:block;overflow:auto}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top"><div><h1>每日投资简报</h1><div class="sub" id="dateLine">读取中…</div></div><div class="status" id="marketStatus">盘前版</div></header>
  <section class="grid" id="metrics"></section>
  <h2 class="section-title">今日 5 条核心主线</h2><section class="cards" id="mainlines"></section>
  <h2 class="section-title">今日最强 3 个方向</h2><section class="summary"><table><thead><tr><th>方向</th><th>持续性</th><th>次日验证信号</th></tr></thead><tbody id="top3"></tbody></table></section>
  <h2 class="section-title">需要回避</h2><section class="summary" id="avoid"></section>
  <footer>本页面用于市场研究与信息整理，不构成投资建议。事实与推演在正文中分开标注。</footer>
</main>
<script>
async function loadBrief(){
  const res=await fetch('./brief.json',{cache:'no-store'});
  const d=await res.json();
  document.getElementById('dateLine').textContent=`${d.date} · 更新时间 ${d.updated_at}`;
  document.getElementById('marketStatus').textContent=d.market_status;
  document.getElementById('metrics').innerHTML=d.metrics.map(x=>`<div class="metric"><div class="k">${x.label}</div><div class="v">${x.value}</div><div class="sub">${x.note||''}</div></div>`).join('');
  document.getElementById('mainlines').innerHTML=d.mainlines.map((x,i)=>`<article class="card"><div class="card-head"><div><div class="rank">#${i+1}</div><div class="title">${x.title}</div></div><div class="stars">${'★'.repeat(x.stars)}${'☆'.repeat(5-x.stars)}</div></div><div class="row"><div class="label">核心事实 / 催化</div><div>${x.fact}</div></div><div class="row"><div class="label">价格确认</div><div>${x.market}</div></div><div class="row"><div class="label">短期影响</div><div>${x.short_term}</div></div><div class="row"><div class="label">中期逻辑</div><div>${x.mid_term}</div></div><div class="row"><div class="label">标的分层</div><div class="tags">${(x.real||[]).map(v=>`<span class="tag real">真实业务 · ${v}</span>`).join('')}${(x.mapping||[]).map(v=>`<span class="tag map">产业映射 · ${v}</span>`).join('')}${(x.sentiment||[]).map(v=>`<span class="tag mood">纯情绪 · ${v}</span>`).join('')}</div></div><div class="row"><div class="label">风险 / 不确定性</div><div class="risk">${x.risk}</div></div></article>`).join('');
  document.getElementById('top3').innerHTML=d.top3.map(x=>`<tr><td><b>${x.name}</b></td><td>${'★'.repeat(x.stars)}${'☆'.repeat(5-x.stars)}</td><td>${x.verify}</td></tr>`).join('');
  document.getElementById('avoid').innerHTML=`<ul>${d.avoid.map(x=>`<li>${x}</li>`).join('')}</ul>`;
}
loadBrief().catch(err=>{document.getElementById('dateLine').textContent='简报数据加载失败，请稍后刷新';console.error(err);});
</script>
</body>
</html>
